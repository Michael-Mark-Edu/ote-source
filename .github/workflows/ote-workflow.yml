name: ote-workflow

on: [push, pull_request]

jobs:
  backend-test:
    # container:
    #   image: mcr.microsoft.com/dotnet/sdk:10.0
    #   network: service
    runs-on: ubuntu-latest
    services:
      db-service:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: ote
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432"]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Create secrets.json
      run: |
        mkdir -p ~/.microsoft/usersecrets/7dd46374-7b55-442e-b4b3-1ae375510d4e
        echo '{ "ConnectionStrings:OteDb": "Host=localhost; Port=5432; Database=ote; Username=postgres; Include Error Detail=true" }' > ~/.microsoft/usersecrets/7dd46374-7b55-442e-b4b3-1ae375510d4e/secrets.json

    - name: Setup project
      run: |
        cd backend
        dotnet build

    - name: Wait for DB
      run: |
        for i in {1..30}; do
          pg_isready -h localhost -p 5432 && break
          echo "Waiting for PostgreSQL… ($i)"
          sleep 1
        done

    - name: Setup DB
      run: |
        cd backend/src/Data.EFCore
        dotnet tool install --global dotnet-ef --version 10.0.2
        export PATH="$PATH:/root/.dotnet/tools"
        dotnet ef database update

    - name: Run tests
      run: |
        cd backend
        dotnet test


  frontend-upload-development:
    needs: [backend-test]
    if: ${{ github.event_name == 'push'
        && github.ref == 'refs/heads/development'
        && github.repository == 'Michael-Mark-Edu/ote-source' }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Build artifacts
      run: |
        cd frontend
        npx vite build --base='https://development.opentextbookexchange.shop/artifact' --outDir artifact

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v5.1.0
      with:
        aws-region: us-west-2
        aws-access-key-id: ${{ secrets.AWS_DEVELOPMENT_CD_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_DEVELOPMENT_CD_SECRET_ACCESS_KEY }}

    - name: Upload build artifacts to S3
      run: aws s3 sync frontend/artifact s3://ote-frontend-source-development/artifact --delete
